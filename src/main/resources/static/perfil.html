<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="theme-color" content="#121314">
    <link rel="manifest" href="/manifest.json">
    <title>Perfil - Registro de Peso</title>
    <link rel="stylesheet" href="style.css">
    <script src="perfil.js" defer></script>
</head>
<body>

    <nav id="header-usuario">
        <h2>Mi Perfil</h2>
        <div>
            <a href="index.html" id="btn-volver-inicio">← Volver al Inicio</a>
            <a href="/logout" id="btn-cerrar-sesion">Cerrar Sesión</a>
        </div>
    </nav>

    <main class="main-perfil">
        <!-- 🟢 Tarjeta 1: Resumen de Estadísticas -->
        <section class="card card-perfil">
            <h3>📊 Resumen de Datos</h3>
            <div class="grid-resumen">
                <div class="stat-box">
                    <small>Peso Actual</small>
                    <p id="perfilPesoActual">-</p>
                </div>
                <div class="stat-box">
                    <small>Variación</small>
                    <p id="perfilVariacion">-</p>
                </div>
                <div class="stat-box">
                    <small>Media (7 días)</small>
                    <p id="perfilMedia">-</p>
                </div>
                <div class="stat-box">
                    <small>Peso Objetivo</small>
                    <p id="perfilPesoObjetivo">-</p>
                </div>
            </div>
        </section>

        <!-- 🟢 Tarjeta 2: Configuración del Objetivo -->
        <section class="card card-perfil">
            <h3>🎯 Peso Objetivo</h3>
            <form id="formObjetivo" class="form-objetivo" onsubmit="event.preventDefault();">
                <label for="inputObjetivo">
                    Meta en kg
                    <input type="number" id="inputObjetivo" step="0.1" placeholder="Ej: 75.0" min="20" max="400">
                </label>
                <button type="button" id="btnGuardarObjetivo">Guardar Objetivo 💾</button>
            </form>
        </section>

        <!-- 🟢 Tarjeta 3: Datos de la Cuenta -->
        <section class="card card-perfil">
            <h3>👤 Datos de la Cuenta</h3>
            <div class="datos-cuenta">
                <p><strong>Usuario:</strong> <span id="nombreUsuarioPerfil">-</span></p>
            </div>
        </section>
    </main>

</body>
</html>
