<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Mi Peso</title>
    <link rel="stylesheet" href="styleLogReg.css">
    <script src="auth.js" defer></script>
</head>
<body>
<main>
    <section class="card" style="max-width: 400px; margin: 40px auto;">
        <div id="registroForm">
            <h2>Crear una Cuenta</h2>
            <form action="/registro" method="post">
                <label>
                    Nombre de usuario
                    <input type="text" id="username" required minlength="3" maxlength="20">
                </label>
                <label>
                    Contraseña
                    <input type="password" id="password" required minlength="4">
                </label>
                <button type="submit" style="margin-top: 15px;">Registrarse</button>
            </form>

            <p id="mensaje" style="margin-top: 15px; font-weight: bold;"></p>

            <p style="margin-top: 20px; text-align: center;">
            ¿Ya tienes cuenta? <a href="/login.html">Inicia sesión aquí</a>
            </p>
        </div>
        
    </section>
</main>
</body>
</html>
